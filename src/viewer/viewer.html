<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Log viewer · Logbeam</title>
    <link rel="icon" href="icons/icon16.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main id="start" hidden>
      <h1><img src="icons/icon48.png" alt="" width="28" height="28" /> Logbeam</h1>
      <label id="drop" class="drop">
        <b>Drop a log file here</b>
        <span>or click to choose one: .log, .txt, .json, and gzip (.gz) too</span>
        <input type="file" id="file" />
      </label>
      <p class="or">or paste a log</p>
      <textarea id="paste" spellcheck="false" placeholder="Paste log lines here"></textarea>
      <button id="open" disabled>Open as log</button>
      <p class="note">Everything stays in your browser. Nothing is uploaded.</p>
    </main>
    <script src="viewer.js"></script>
  </body>
</html>
