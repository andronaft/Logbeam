<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="viewerPageTitle">Log viewer · Logbeam</title>
    <link rel="icon" href="icons/icon16.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main id="start" hidden>
      <h1><img src="icons/icon48.png" alt="" width="28" height="28" /> Logbeam</h1>
      <label id="drop" class="drop">
        <b data-i18n="viewerStartDrop">Drop a log file here</b>
        <span data-i18n="viewerStartChoose">or click to choose one: .log, .txt, .json, and gzip (.gz) too</span>
        <input type="file" id="file" />
      </label>
      <p class="or" data-i18n="viewerStartOr">or paste a log</p>
      <textarea
        id="paste"
        spellcheck="false"
        placeholder="Paste log lines here"
        data-i18n-placeholder="viewerStartPlaceholder"
      ></textarea>
      <button id="open" disabled data-i18n="popupOpenAsLog">Open as log</button>
      <p class="note" data-i18n="viewerStartNote">Everything stays in your browser. Nothing is uploaded.</p>
    </main>
    <script src="viewer.js"></script>
  </body>
</html>
