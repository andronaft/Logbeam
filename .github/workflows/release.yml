name: release

# Release by pushing a tag like v0.2.1, or with "Run workflow" on the Actions tab (it tags the
# version from src/manifest.json itself). Tests everything, publishes a GitHub Release with the ZIP
# and, when the Chrome Web Store secrets are set (docs/PUBLISHING.md), submits it to the store.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CWS_EXTENSION_ID: kgjadbnghdgmcafdfgjhgfgcgnnnmcpe

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the release tag
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in src/manifest.json and package.json first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test in Chromium
        run: npm run e2e
      - run: npm run package
      - name: Extract release notes from CHANGELOG.md
        run: |
          version=$VERSION
          awk "/^## \\[?$version\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Logbeam ${{ env.VERSION }}
          files: logbeam-*.zip
          body_path: notes.md
      - name: Publish to the Chrome Web Store
        if: env.CWS_REFRESH_TOKEN != ''
        run: node scripts/publish-cws.mjs logbeam-*.zip
      - name: Chrome Web Store skipped
        if: env.CWS_REFRESH_TOKEN == ''
        run: echo "::notice::CWS_* secrets are not set, so the store wasn't updated. See docs/PUBLISHING.md."
