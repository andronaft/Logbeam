name: release

# Release by pushing a tag like v0.2.1, or with "Run workflow" on the Actions tab (it tags the
# version from src/manifest.json itself). Tests everything in Chromium and Firefox, publishes a
# GitHub Release with the ZIPs and SHA256SUMS, and submits them to the Chrome Web Store and
# addons.mozilla.org when their secrets are set (docs/PUBLISHING.md).
#
# Three jobs, so the build tools never see the store secrets or a token that can write:
#   build           npm ci, tests, ZIPs, SHA256SUMS; read-only token, no secrets
#   github-release  checks SHA256SUMS, attests the ZIPs, creates the release; no npm, no secrets
#   publish         the "stores" environment (a reviewer approves it); runs no project dependencies,
#                   and only the steps that talk to a store get its secrets
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CWS_EXTENSION_ID: kgjadbnghdgmcafdfgjhgfgcgnnnmcpe
  # The publish job runs this web-ext and no other project dependency; keep it at the version in package-lock.json
  WEB_EXT_VERSION: 10.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the release tag
        id: tag
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in src/manifest.json and package.json first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check that the publish job's web-ext matches package-lock.json
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/web-ext'].version")
          [ "$locked" = "$WEB_EXT_VERSION" ] ||
            echo "::warning::release.yml and publish.yml sign with web-ext $WEB_EXT_VERSION, package-lock.json has $locked; update WEB_EXT_VERSION."
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test in Chromium
        run: npm run e2e
      - run: npm run lint:firefox
      - name: End-to-end test in Firefox
        run: npm run e2e:firefox
      - run: npm run package
      - name: Extract release notes from CHANGELOG.md
        run: |
          version=$VERSION
          awk "/^## \\[?$version\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > notes.md
      - name: Write SHA256SUMS
        run: |
          mkdir "$RUNNER_TEMP/release"
          mv "logbeam-$VERSION.zip" "logbeam-firefox-$VERSION.zip" "logbeam-source-$VERSION.zip" notes.md "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum logbeam-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and, from "Run workflow", its tag
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the version and SHA256SUMS
        working-directory: release
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ && "$TAG" = "v$VERSION" ]] || { echo "Unexpected version '$VERSION'"; exit 1; }
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/logbeam-*.zip
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Logbeam $VERSION" --notes-file release/notes.md
          "release/logbeam-$VERSION.zip" "release/logbeam-firefox-$VERSION.zip"
          "release/logbeam-source-$VERSION.zip" release/SHA256SUMS

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Only the two files this job needs, from the released commit; nothing the build job made runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-cws.mjs
            docs/amo-metadata.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check SHA256SUMS
        id: verify
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS
      - name: See which stores have secrets
        id: stores
        env:
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          if [ -n "$CWS_REFRESH_TOKEN" ]; then echo "cws=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Chrome Web Store skipped: CWS_* secrets are not set."; fi
          if [ -n "$AMO_JWT_ISSUER" ]; then echo "amo=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::addons.mozilla.org skipped: AMO_* secrets are not set."; fi

      # Each store is tried even if the other one fails; the job still fails if either did.
      - name: Publish to the Chrome Web Store
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.stores.outputs.cws == 'true' }}
        # publish-cws.mjs uses only Node's own modules
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-cws.mjs "$RUNNER_TEMP/release/logbeam-$VERSION.zip"
      - name: Get web-ext and the Firefox build
        id: web-ext
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.stores.outputs.amo == 'true' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/web-ext" --ignore-scripts --no-save --no-audit --no-fund "web-ext@$WEB_EXT_VERSION"
          unzip -q "$RUNNER_TEMP/release/logbeam-firefox-$VERSION.zip" -d dist-firefox
      - name: Publish to addons.mozilla.org
        if: ${{ !cancelled() && steps.web-ext.outcome == 'success' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --approval-timeout 0: submit for review without waiting for it
        run: >-
          "$RUNNER_TEMP/web-ext/node_modules/.bin/web-ext" sign --channel listed --source-dir dist-firefox
          --upload-source-code "$RUNNER_TEMP/release/logbeam-source-$VERSION.zip" --amo-metadata docs/amo-metadata.json
          --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
