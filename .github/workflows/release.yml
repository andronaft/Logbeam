name: release

# Release by pushing a tag like v0.2.1, or with "Run workflow" on the Actions tab (it tags the
# version from src/manifest.json itself). Tests everything in Chromium and Firefox, publishes a
# GitHub Release with the ZIPs and submits them to every store whose secrets are set
# (docs/PUBLISHING.md): Chrome Web Store, Microsoft Edge Add-ons and addons.mozilla.org.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CWS_EXTENSION_ID: kgjadbnghdgmcafdfgjhgfgcgnnnmcpe

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the release tag
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in src/manifest.json and package.json first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test in Chromium
        run: npm run e2e
      - run: npm run lint:firefox
      - name: End-to-end test in Firefox
        run: npm run e2e:firefox
      - run: npm run package
      - name: Extract release notes from CHANGELOG.md
        run: |
          version=$VERSION
          awk "/^## \\[?$version\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        id: github-release
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Logbeam ${{ env.VERSION }}
          files: |
            logbeam-${{ env.VERSION }}.zip
            logbeam-firefox-${{ env.VERSION }}.zip
          body_path: notes.md

      # Each store is tried even if another one fails; the job still fails if any of them did.
      - name: Publish to the Chrome Web Store
        if: ${{ !cancelled() && steps.github-release.outcome == 'success' && env.CWS_REFRESH_TOKEN != '' }}
        run: node scripts/publish-cws.mjs "logbeam-$VERSION.zip"
      - name: Publish to Microsoft Edge Add-ons
        if: ${{ !cancelled() && steps.github-release.outcome == 'success' && env.EDGE_API_KEY != '' }}
        run: node scripts/publish-edge.mjs "logbeam-$VERSION.zip"
      - name: Publish to addons.mozilla.org
        if: ${{ !cancelled() && steps.github-release.outcome == 'success' && env.AMO_JWT_ISSUER != '' }}
        # --approval-timeout 0: submit for review without waiting for it
        run: >-
          npx web-ext sign --channel listed --source-dir dist-firefox
          --upload-source-code "logbeam-source-$VERSION.zip" --amo-metadata docs/amo-metadata.json
          --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Stores without secrets
        if: ${{ !cancelled() }}
        run: |
          [ -n "$CWS_REFRESH_TOKEN" ] || echo "::notice::Chrome Web Store skipped: CWS_* secrets are not set."
          [ -n "$EDGE_API_KEY" ] || echo "::notice::Edge Add-ons skipped: EDGE_* secrets are not set."
          [ -n "$AMO_JWT_ISSUER" ] || echo "::notice::addons.mozilla.org skipped: AMO_* secrets are not set."
          echo "See docs/PUBLISHING.md. Opera add-ons has no upload API: upload logbeam-$VERSION.zip by hand."
