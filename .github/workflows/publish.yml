name: publish

# Sends an already released version to a store again, e.g. when the Chrome Web Store refused the
# upload because the previous version was still in review. Sends the release's own ZIPs after
# checking them against its SHA256SUMS; a release made before SHA256SUMS existed is built from
# its tag instead. As in release.yml, the job that may run npm ci gets no secrets, and the job
# that gets them runs in the "stores" environment without any project dependency.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish, e.g. v0.4.0
        required: true
      store:
        description: Store
        type: choice
        options: [chrome, firefox, both]
        default: chrome

permissions:
  contents: read

env:
  CWS_EXTENSION_ID: kgjadbnghdgmcafdfgjhgfgcgnnnmcpe
  WEB_EXT_VERSION: 10.8.0 # as in release.yml
  TAG: ${{ inputs.tag }}

jobs:
  files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "'$TAG' is not a release tag like v0.4.0"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Download the release's files
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern 'logbeam-*.zip' || true
          if [ -f SHA256SUMS ]; then
            sha256sum -c SHA256SUMS
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm -f logbeam-*.zip
            echo "::notice::$TAG has no SHA256SUMS on its release, so it is built from the tag."
          fi

      # Only for a release without SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.released.outputs.found != 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.released.outputs.found != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build the tag
        if: steps.released.outputs.found != 'true'
        run: |
          npm ci
          npm run package
          mv logbeam-*.zip "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum logbeam-*.zip > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: files
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.files.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-cws.mjs
            docs/amo-metadata.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check SHA256SUMS
        id: verify
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS
      - name: Publish to the Chrome Web Store
        if: inputs.store != 'firefox'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-cws.mjs "$RUNNER_TEMP/release/logbeam-$VERSION.zip"
      - name: Get web-ext and the Firefox build
        id: web-ext
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && inputs.store != 'chrome' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/web-ext" --ignore-scripts --no-save --no-audit --no-fund "web-ext@$WEB_EXT_VERSION"
          unzip -q "$RUNNER_TEMP/release/logbeam-firefox-$VERSION.zip" -d dist-firefox
      - name: Publish to addons.mozilla.org
        if: ${{ !cancelled() && steps.web-ext.outcome == 'success' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          "$RUNNER_TEMP/web-ext/node_modules/.bin/web-ext" sign --channel listed --source-dir dist-firefox
          --upload-source-code "$RUNNER_TEMP/release/logbeam-source-$VERSION.zip" --amo-metadata docs/amo-metadata.json
          --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
